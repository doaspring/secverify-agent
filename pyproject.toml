[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secverify-agent"
version = "0.1.0"
description = "SecVerify Agent - Intern-S2 agent tool-call security enforcement with policy gate, provenance and human approval"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "langgraph>=1.0",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
sqlite = ["langgraph-checkpoint-sqlite>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
